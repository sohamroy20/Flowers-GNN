# Training loop config. Same defaults for all models unless overridden.

# Duration
epochs: 5   # small for smoke test; bump way up for real runs

# Optimizer
optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-4
  weight_decay: 1e-4

# LR scheduler: linear warmup + cosine decay
# Applied per-epoch, not per-step, in Phase 1. We can move to per-step later.
lr_scheduler:
  warmup_epochs: 1
  eta_min_factor: 0.1  # eta_min = optimizer.lr * eta_min_factor

# Rollout eval settings
rollout:
  horizons: [1, 10, 20, 50, 100, 200]
  max_trajectories: 5   # rollout is expensive; sample a few valid trajs per eval
  eval_every_n_epochs: 1

# Checkpointing
checkpoint:
  save_every_n_epochs: 1
  keep_last: 3